training:
  max_epochs: 20
  lr: 0.001
  logger: false
  max_iterations: 20
  mode: open-loop
dataset:
  input_labels:
  - dx
  - dy
  - dz
  - vx
  - vy
  - vz
  - phi
  - theta
  - psi
  - p
  - q
  - r
  - Mx_ext
  - My_ext
  - Mz_ext
  - omega
  output_labels:
  - u
  train_path: ../Simulation/datasets/hover_dataset_train_bebop2_corrected.npz
  val_path: ../Simulation/datasets/hover_dataset_val_bebop2_corrected.npz
  bebop_model: bebop2
  normalized: true
  with_noise: false
  with_bias: false
  with_delay: false
  input_dim: 19
  input_size: 19
  output_dim: 4
  output_size: 4
closed_loop:
  starting_seq: 15
  seq_len: 15
  lambda_cmd: 0.8
  lambda_pos: 0.1
  freq_timesteps: 5
mlp_block:
  no_layers:
  - 64
  - 128
  - 128
  - 256
  value: false
conv_block:
  value: true
  output_dim: 256
sequencing:
  value: true
  seq_len: 1
dataloader:
  batch_size: 32
  num_workers: 8
  pin_memory: false
  drop_last: true
model:
  type: cfc
  no_neurons_layer: 64
  ode_unfolds: 6
  cfc_mode: default
  backbone_units: 128
  backbone_layers: 1
  backbone_dropout: 0.0
  activation: relu
  mixed_memory: false
  scale_factor: 1.0
model_variant:
  family: cfc
  base_conv_channels: 256
  base_backbone_units: 128
  width: base
  ode_unfolds: 6
